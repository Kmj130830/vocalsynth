name: Windows Qt Build

on:
  push:
    branches:
      - feature/openutau-editor-rebuild
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          if (Test-Path build-clean) { Remove-Item build-clean -Recurse -Force }
          cmake -S . -B build-clean -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        run: cmake --build build-clean --parallel

      - name: Test
        run: ctest --test-dir build-clean --output-on-failure
